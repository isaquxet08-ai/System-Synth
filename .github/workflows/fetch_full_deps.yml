name: Fetch and Publish Full AOSP Deps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-full-deps:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync Full Dependencies
        run: |
          sudo mkdir -p /mnt/aosp
          sudo chown -R $USER:$USER /mnt/aosp
          
          cd /mnt/aosp
          repo init -u https://android.googlesource.com/platform/manifest -b android-12.0.0_r1
          
          echo ">>> 拉取纯血 v28-v30 全量库..."
          repo sync -c --no-tags --no-clone-bundle -j4 \
            platform/build \
            platform/build/soong \
            platform/build/blueprint \
            platform/system/core \
            platform/system/logging \
            platform/system/libbase \
            platform/system/sepolicy \
            platform/system/extras \
            platform/system/tools/aidl \
            platform/bionic \
            platform/external/selinux \
            platform/external/protobuf \
            platform/external/golang-protobuf \
            platform/external/pcre \
            platform/external/zlib \
            platform/external/lz4 \
            platform/external/zstd \
            platform/external/boringssl \
            platform/external/starlark-go \
            platform/prebuilts/vndk/v28 \
            platform/prebuilts/vndk/v29 \
            platform/prebuilts/vndk/v30 \
            platform/prebuilts/build-tools \
            platform/prebuilts/go/linux-x86

      - name: Pack and Upload
        run: |
          cd /mnt/aosp
          tar --exclude='.repo' --exclude='.git' -czf /mnt/aosp/aosp_full_deps.tar.gz *
          gh release upload aosp-full-deps-v1 /mnt/aosp/aosp_full_deps.tar.gz --clobber --repo isaquxet08-ai/System-Synth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
