name: Extract Official Init

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract_init:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download and Extract Init
        run: |
          echo ">>> 下载官方模拟器包..."
          wget -q --tries=3 https://dl.google.com/android/repository/sys-img/google_apis/arm64-v8a-S_r01.zip -O emulator.zip
          
          echo ">>> 只解压 ramdisk.img..."
          unzip -q emulator.zip arm64-v8a/ramdisk.img
          mv arm64-v8a/ramdisk.img ./
          
          echo ">>> 解包 lz4 并提取 init..."
          sudo apt-get update -qq && sudo apt-get install -y lz4 cpio
          lz4 -d ramdisk.img ramdisk.cpio
          mkdir -p extracted && cd extracted
          cpio -idmv < ../ramdisk.cpio
          
          cp init ../init_official
          cd ..
          chmod 755 init_official

          # 🚨 核心防呆：如果 init_official 不存在或为空，直接报错退出！
          if [ ! -s "init_official" ]; then
            echo "❌ 提取失败，文件为空！"
            exit 1
          fi
          
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: official-init-${{ github.run_number }}
          name: Official QEMU Init
          draft: false
          prerelease: true
          files: "init_official"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
