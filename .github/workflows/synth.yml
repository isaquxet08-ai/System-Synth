name: Download and Compress System Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download_and_pack:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          swap-storage: true

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd wget unzip

      - name: Download Base GSI
        run: |
          echo ">>> 正在下载 GSI 底包..."
          wget -q https://dl.google.com/developers/android/sc/images/gsi/aosp_arm64-exp-SPB1.210331.013-7333779-3227774b.zip -O gsi.zip
          
          echo ">>> 正在解压 system.img..."
          unzip -q gsi.zip system.img
          mv system.img base_system.img
          
      - name: Compress Image
        run: |
          echo ">>> 正在极限压缩..."
          zstd -19 -T0 base_system.img -o pure_system.img.zst

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: pure-system-${{ github.run_number }}
          name: Pure System Image
          draft: false
          prerelease: true
          files: "pure_system.img.zst"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
