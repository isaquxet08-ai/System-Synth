name: Build Synth Init (Private Cache)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_init:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 openjdk-11-jdk

      - name: Fetch Private Deps and Clang
        run: |
          sudo mkdir -p /mnt/aosp
          sudo chown -R $USER:$USER /mnt/aosp
          cd /mnt/aosp
          wget -q https://github.com/isaquxet08-ai/System-Synth/releases/download/aosp-full-deps-v1/aosp_full_deps.tar.gz -O deps.tar.gz
          tar -xzf deps.tar.gz
          rm deps.tar.gz
          
          mkdir -p prebuilts/clang/host/linux-x86/clang-r416183b
          wget -q https://github.com/isaquxet08-ai/System-Synth/releases/download/clang-toolchain-v1/clang-r416183b.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r416183b
          rm clang.tar.gz
          echo "/mnt/aosp/prebuilts/clang/host/linux-x86/clang-r416183b/bin" >> $GITHUB_PATH

      - name: Patch Source and Build Init
        run: |
          cd /mnt/aosp
          
          echo ">>> 强拆冲突文件并重建目录..."
          rm -rf bionic/libc/versioner-dependencies/common/clang-builtins
          mkdir -p bionic/libc/versioner-dependencies/common/clang-builtins
          touch bionic/libc/versioner-dependencies/common/clang-builtins/.keep

          echo ">>> 物理切除 init 的自杀逻辑..."
          sed -i 's/CHECKCALL(mount("sysfs"/mount("sysfs"/g' system/core/init/first_stage_init.cpp
          sed -i 's/CHECKCALL(mount("selinuxfs"/mount("selinuxfs"/g' system/core/init/first_stage_init.cpp
          sed -i 's/LOG(FATAL)/LOG(WARNING)/g' system/core/init/first_stage_init.cpp
          sed -i 's/abort();/;/g' system/core/init/first_stage_init.cpp

          echo ">>> 终极定点爆破：封杀 AIDL 模块！"
          mkdir -p system/tools/aidl/build && echo 'soong_namespace { imports: [], }' > system/tools/aidl/build/Android.bp
          mkdir -p system/tools/aidl/metadata && echo 'soong_namespace { imports: [], }' > system/tools/aidl/metadata/Android.bp
          mkdir -p system/tools/aidl/build/apex && echo 'soong_namespace { imports: [], }' > system/tools/aidl/build/apex/Android.bp
          mkdir -p system/tools/aidl/tests/stability_test && echo 'soong_namespace { imports: [], }' > system/tools/aidl/tests/stability_test/Android.bp
          mkdir -p system/tools/aidl/tests/lazy_test && echo 'soong_namespace { imports: [], }' > system/tools/aidl/tests/lazy_test/Android.bp
          mkdir -p system/extras/profcollectd/libprofcollectd && echo 'soong_namespace { imports: [], }' > system/extras/profcollectd/libprofcollectd/Android.bp
          mkdir -p system/extras/partition_tools/aidl && echo 'soong_namespace { imports: [], }' > system/extras/partition_tools/aidl/Android.bp
          echo 'soong_namespace { imports: [], }' > system/tools/aidl/Android.bp
          
          echo ">>> 斩杀无用的宿主机语法检查工具 host_init_verifier！"
          # 用 Python 把 host_init_verifier 这个模块从 Android.bp 里直接剔除
          python3 -c "import re; f='system/core/init/Android.bp'; c=open(f).read(); c=re.sub(r'cc_binary \{\s*name: \"host_init_verifier\".*?\n\}', '', c, flags=re.DOTALL); open(f, 'w').write(c)"
          
          export ALLOW_MISSING_DEPENDENCIES=true
          export WITH_DEXPREOPT=false
          
          source build/envsetup.sh || true
          lunch aosp_arm64-userdebug || true
          
          # 直接编译第二阶段的 init 二进制文件
          m init_second_stage -j4 || echo "编译报错，准备兜底打捞"

      - name: Rescue and Upload
        if: always()
        run: |
          cd /mnt/aosp
          INIT_PATH=$(find out/ -name "init" -type f | grep -v "\.o" | head -n 1)
          if [ -n "$INIT_PATH" ]; then
            cp "$INIT_PATH" /mnt/aosp/init_synth
            chmod 755 /mnt/aosp/init_synth
            gh release create synth-init-${{ github.run_number }} /mnt/aosp/init_synth --title "Synth Init" || true
            gh release upload synth-init-${{ github.run_number }} /mnt/aosp/init_synth --clobber || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
