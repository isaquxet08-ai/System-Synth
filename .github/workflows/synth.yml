name: Synth System Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synth:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          swap-storage: true

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs zstd wget unzip

      - name: Download Base GSI
        run: |
          wget -q https://dl.google.com/developers/android/sc/images/gsi/aosp_arm64-exp-SPB1.210331.013-7333779-3227774b.zip -O gsi.zip
          unzip -q gsi.zip system.img
          mv system.img base_system.img

      - name: Download Emulator Image
        run: |
          wget -q https://dl.google.com/android/repository/sys-img/google_apis/arm64-v8a-S_r01.zip -O emulator.zip
          unzip -q emulator.zip system.img
          simg2img system.img emulator_raw.img
          debugfs -R "dump /system/bin/init init_official" emulator_raw.img

      - name: Splicing Init and BusyBox
        run: |
          echo ">>> 解除系统盘封印..."
          debugfs -w -R "feature -shared_blocks" base_system.img
          
          echo ">>> 1. 换官方心脏..."
          debugfs -w -R "rm /system/bin/init" base_system.img
          debugfs -w -R "write init_official /system/bin/init" base_system.img
          debugfs -w -R "sif /system/bin/init mode 0100755" base_system.img
          
          echo ">>> 2. 缝合 BusyBox..."
          debugfs -w -R "write busybox /system/bin/busybox" base_system.img
          debugfs -w -R "sif /system/bin/busybox mode 0100755" base_system.img

      - name: Compress Image
        run: |
          zstd -19 -T0 base_system.img -o system_synth.img.zst

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: synth-system-${{ github.run_number }}
          name: Synth System Image + BusyBox
          draft: false
          prerelease: true
          files: "system_synth.img.zst"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
